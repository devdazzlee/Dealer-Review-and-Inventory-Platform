name: Deploy Backend to VPS

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "ecosystem.config.cjs"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: asr-vps-backend
  cancel-in-progress: true

jobs:
  deploy-backend:
    name: Deploy backend
    runs-on: [self-hosted, linux, asr-vps]
    timeout-minutes: 30
    steps:
      - name: Build and reload asr-backend
        env:
          ASR_DEPLOY_TARGET: backend
        run: |
          set -euo pipefail
          /usr/local/bin/asr-vps-deploy
