name: Deploy Frontend to VPS

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: asr-vps-frontend
  cancel-in-progress: true

jobs:
  deploy-frontend:
    name: Deploy frontend
    runs-on: [self-hosted, linux, asr-vps]
    timeout-minutes: 90
    steps:
      - name: Build and reload asr-frontend
        env:
          ASR_DEPLOY_TARGET: frontend
        run: |
          set -euo pipefail
          /usr/local/bin/asr-vps-deploy
