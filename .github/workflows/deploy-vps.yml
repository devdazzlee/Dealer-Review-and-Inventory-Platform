name: Deploy AutoSalesReviews to VPS

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "ecosystem.config.cjs"
      - "scripts/vps-deploy.sh"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch:

concurrency:
  group: asr-vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy on VPS
    runs-on: [self-hosted, linux, asr-vps]
    timeout-minutes: 45
    steps:
      - name: Run ASR deploy script
        run: |
          set -euo pipefail
          /var/www/autosalesreviews/scripts/vps-deploy.sh
