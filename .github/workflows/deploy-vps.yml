name: Deploy AutoSalesReviews to VPS

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "ecosystem.config.cjs"
      - "scripts/vps-deploy.sh"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch:

concurrency:
  group: asr-vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          request_pty: true
          command_timeout: 40m
          script: |
            set -euo pipefail
            /var/www/autosalesreviews/scripts/vps-deploy.sh
